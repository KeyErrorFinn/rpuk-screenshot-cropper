name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Node tests
        run: npm test
      - name: Run UI tests
        run: npm run test:ui
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Run packaged end-to-end tests
        run: xvfb-run --auto-servernum npm run test:e2e
